<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.ico" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="A collection of examples demonstrating how to integrate xMoney payments"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>xMoney - Payment Examples</title>
    <script>
      (function () {
        var version = 'v2';
        try {
          var stored = window.localStorage.getItem('xmoney-sdk-version');
          if (stored) version = JSON.parse(stored);
        } catch (e) {}
        document.write(
          '<scr' + 'ipt src="https://secure.xmoney.com/sdk/' +
          version + '/xmoney.js"><\/scr' + 'ipt>'
        );
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
